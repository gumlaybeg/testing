<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bad Habit - Steve Lacy</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top left, #2d1b4e, #110d1f 60%, #08060d);
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #a855f7;
      --accent-hover: #c084fc;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 1.5rem;
    }

    .player-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .cover-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.45);
    }

    .cover-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .player-card.playing .cover-wrapper img {
      transform: scale(1.03);
    }

    .track-info {
      text-align: center;
      width: 100%;
    }

    .track-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Progress & Sliders */
    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: var(--accent-hover);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      color: var(--accent-hover);
      transform: scale(1.08);
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-play {
      width: 58px;
      height: 58px;
      background: var(--accent);
      border-radius: 50%;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
    }

    .btn-play:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    /* Volume */
    .volume-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-top: 6px;
    }

    .volume-container svg {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <main class="player-card" id="playerCard">
    <!-- Album Artwork -->
    <div class="cover-wrapper">
      <img src="images/Screenshot_20260905_230804.jpg" alt="Bad Habit Cover Art" />
    </div>

    <!-- Song Info -->
    <div class="track-info">
      <h1 class="track-title">Bad Habit</h1>
      <p class="track-artist">Steve Lacy</p>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="audio" preload="metadata">
      <source src="audios/Bad Habit - Steve Lacy.ogg" type="audio/ogg" />
      Your browser does not support the audio element.
    </audio>

    <!-- Scrubber -->
    <div class="progress-section">
      <input type="range" id="progressBar" value="0" min="0" step="0.1" />
      <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="totalDuration">0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="controls">
      <button class="btn" id="rewindBtn" title="Back 10 seconds" aria-label="Rewind 10 seconds">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
        </svg>
      </button>

      <button class="btn btn-play" id="playBtn" aria-label="Play or Pause">
        <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>

      <button class="btn" id="forwardBtn" title="Forward 10 seconds" aria-label="Forward 10 seconds">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
        </svg>
      </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1" aria-label="Volume Slider" />
    </div>
  </main>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playerCard = document.getElementById('playerCard');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');
    const volumeBar = document.getElementById('volumeBar');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');

    const playSvg = '<path d="M8 5v14l11-7z"/>';
    const pauseSvg = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    playBtn.addEventListener('click', togglePlay);

    audio.addEventListener('play', () => {
      playIcon.innerHTML = pauseSvg;
      playerCard.classList.add('playing');
    });

    audio.addEventListener('pause', () => {
      playIcon.innerHTML = playSvg;
      playerCard.classList.remove('playing');
    });

    audio.addEventListener('loadedmetadata', () => {
      progressBar.max = audio.duration;
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      progressBar.value = audio.currentTime;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });

    rewindBtn.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardBtn.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
    });

    volumeBar.addEventListener('input', (e) => {
      audio.volume = e.target.value;
    });
  </script>
</body>
</html>
